services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nagrik_setu}
      POSTGRES_USER: ${POSTGRES_USER:-nagrik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storage-data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done &&
      mc mb --ignore-existing local/nagrik-private &&
      mc anonymous set none local/nagrik-private &&
      printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject"],"Resource":["arn:aws:s3:::nagrik-private/*"]}]}' > /tmp/nagrik-private.json &&
      (mc admin policy info local nagrik-private-rw >/dev/null 2>&1 || mc admin policy create local nagrik-private-rw /tmp/nagrik-private.json) &&
      (mc admin user info local "$${MINIO_APP_USER}" >/dev/null 2>&1 || mc admin user add local "$${MINIO_APP_USER}" "$${MINIO_APP_PASSWORD}") &&
      mc admin policy attach local nagrik-private-rw --user "$${MINIO_APP_USER}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_APP_USER: ${MINIO_APP_USER:?Set MINIO_APP_USER in .env}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Set MINIO_APP_PASSWORD in .env}

  ai-service:
    build: ./ai-service
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nagrik}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nagrik_setu}?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: nagrik-private
      STORAGE_ACCESS_KEY: ${MINIO_APP_USER}
      STORAGE_SECRET_KEY: ${MINIO_APP_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      NODE_ENV: production
      COOKIE_SECURE: "false"
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose: ["4000"]

  ai-worker:
    build: ./backend
    command: ["node", "dist/src/worker.js"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nagrik}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nagrik_setu}?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  storage-data:
