services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost
          --eval "try { rs.status().ok === 1 } catch (_) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok === 1 }"
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["legacy-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storage-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["legacy-storage"]
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done &&
      mc mb --ignore-existing local/nagrik-private &&
      mc anonymous set none local/nagrik-private &&
      printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::nagrik-private/*"]}]}' > /tmp/nagrik-private.json &&
      (mc admin policy info local nagrik-private-read >/dev/null 2>&1 || mc admin policy create local nagrik-private-read /tmp/nagrik-private.json) &&
      (mc admin user info local "$${MINIO_APP_USER}" >/dev/null 2>&1 || mc admin user add local "$${MINIO_APP_USER}" "$${MINIO_APP_PASSWORD}") &&
      mc admin policy attach local nagrik-private-read --user "$${MINIO_APP_USER}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_APP_USER: ${MINIO_APP_USER:?Set MINIO_APP_USER in .env}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Set MINIO_APP_PASSWORD in .env}

  ai-service:
    build: ./ai-service
    environment:
      TEXT_MODEL_NAME: ${TEXT_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      TEXT_MODEL_REVISION: ${TEXT_MODEL_REVISION:-main}
      IMAGE_MODEL_NAME: ${IMAGE_MODEL_NAME:-google/vit-base-patch16-224}
      IMAGE_MODEL_REVISION: ${IMAGE_MODEL_REVISION:-main}
      DUPLICATE_SIMILARITY_THRESHOLD: ${DUPLICATE_SIMILARITY_THRESHOLD:-0.72}
      DUPLICATE_SEARCH_RADIUS_KM: ${DUPLICATE_SEARCH_RADIUS_KM:-100}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mongodb://mongo:27017/nagrik_setu?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      DUPLICATE_SEARCH_RADIUS_KM: ${DUPLICATE_SEARCH_RADIUS_KM:-100}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      NODE_ENV: production
      COOKIE_SECURE: "false"
      TRUST_PROXY: "true"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["4000"]

  ai-worker:
    build: ./backend
    command: ["node", "src/worker.js"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mongodb://mongo:27017/nagrik_setu?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      DUPLICATE_SEARCH_RADIUS_KM: ${DUPLICATE_SEARCH_RADIUS_KM:-100}
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

  frontend-next:
    build:
      context: .
      dockerfile: frontend-next/Dockerfile
      args:
        BACKEND_URL: http://api:4000
    environment:
      BACKEND_URL: http://api:4000
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  mongo-data:
  redis-data:
  storage-data:
